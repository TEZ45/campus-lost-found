[project]
name = "campus-lost-found"
version = "0.1.0"
description = "Campus Lost and Found Matching System"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "python-dotenv>=1.2.4,<2",
    "pillow>=13.0,<14",
    "redis>=8.1,<9",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "pytest-django>=4.14,<5",
    "ruff>=0.17.4,<0.18",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
django_debug_mode = true
python_files = ["test_*.py"]
markers = ["redis_integration: requires an explicit isolated REDIS_TEST_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["RUF012"]
