<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生登錄 / Student Login - Campus Lost & Found</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(160deg, #1d7a43 0%, #2ea55c 55%, #43b96f 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .login-box { width: 100%; max-width: 420px; }
        .login-title {
            color: #fff; text-align: center; font-size: 30px; font-weight: 700;
            letter-spacing: 1px; margin-bottom: 8px;
        }
        .login-subtitle {
            color: rgba(255, 255, 255, .85); text-align: center;
            font-size: 15px; line-height: 1.6; margin-bottom: 36px;
        }
        .field { margin-bottom: 18px; }
        .field label { display: block; color: #fff; font-size: 14px; margin-bottom: 6px; }
        .field input {
            width: 100%; padding: 14px 16px; font-size: 15px;
            border: none; border-radius: 10px; background: #fff; color: #14331f; outline: none;
        }
        .field input::placeholder { color: #9db8a8; }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 50px; }
        .eye {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; padding: 8px; color: #1d7a43;
            display: flex; align-items: center;
        }
        .agree {
            display: flex; align-items: center; gap: 8px; color: #fff;
            font-size: 13px; margin-bottom: 22px; cursor: pointer;
        }
        .agree input { width: 18px; height: 18px; accent-color: #fff; cursor: pointer; }
        .login-btn {
            width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
            background: #fff; color: #1d7a43; border: none; border-radius: 24px; cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
        }
        .login-btn:active { transform: scale(.98); }
        .forgot {
            display: block; text-align: center; color: rgba(255, 255, 255, .9);
            font-size: 13px; margin-top: 20px; text-decoration: none;
        }
        .error-box {
            background: #fff; color: #c0392b; border-radius: 10px;
            padding: 12px 14px; margin-bottom: 18px; font-size: 14px; text-align: center;
        }
        .register-link {
            display: block; text-align: center; color: rgba(255, 255, 255, .75);
            font-size: 13px; margin-top: 30px; text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1 class="login-title">學生登錄 / Student Login</h1>
        <p class="login-subtitle">從這裡開始...<br>Start Here</p>

        {% if form.errors %}
        <div class="error-box">賬號或密碼錯誤，請重試。</div>
        {% endif %}

        <form method="post" onsubmit="return checkAgree()">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="field">
                <label for="id_username">賬號</label>
                <input type="text" id="id_username" name="username" placeholder="請輸入賬號"
                       autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="id_password">密碼</label>
                <div class="password-wrap">
                    <input type="password" id="id_password" name="password" placeholder="請輸入密碼"
                           autocomplete="current-password" required>
                    <button type="button" class="eye" id="eyeBtn" aria-label="顯示/隱藏密碼" title="顯示/隱藏密碼">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <label class="agree">
                <input type="checkbox" id="agreeTerms">
                <span>已閱讀並同意《WeMust隱私保護聲明》</span>
            </label>
            <button type="submit" class="login-btn">登錄</button>
        </form>

        <a href="#" class="forgot"
           onclick="alert('請聯繫校園失物招領服務處或管理員重置密碼。'); return false;">忘記密碼/密碼過期</a>
        <a href="/register/" class="register-link">沒有賬號？立即註冊</a>
    </div>

    <script>
        (function () {
            var eye = document.getElementById("eyeBtn");
            var pw = document.getElementById("id_password");
            if (eye && pw) {
                eye.addEventListener("click", function () {
                    pw.type = pw.type === "password" ? "text" : "password";
                });
            }
        })();
        function checkAgree() {
            var box = document.getElementById("agreeTerms");
            if (!box.checked) {
                alert("請先閱讀並同意《WeMust隱私保護聲明》");
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
