{% extends "base.html" %}

{% block title %}Login - Campus Lost & Found{% endblock %}

{% block content %}
<div class="card">
    <h1 style="margin-bottom: 1rem;">Login</h1>
    {% if form.errors %}
    <div class="form-errors"><strong>Invalid username or password.</strong></div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>Username</label>{{ form.username }}</div>
        <div class="form-group"><label>Password</label>{{ form.password }}</div>
        <button type="submit" class="btn btn-success">Login</button>
    </form>
    <p style="margin-top: 1rem;">No account? <a href="/register/">Register</a></p>
</div>
{% endblock %}
